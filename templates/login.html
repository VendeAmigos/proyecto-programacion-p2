{% extends "base.html" %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-box">
    <h2>Iniciar Sesión</h2>
    <p class="auth-subtitle">Accede a tu cuenta de Audio Minimal.</p>

    <form action="{{ url_for('login') }}" method="POST">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" name="username" id="username" placeholder="Tu usuario" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" name="password" id="password" placeholder="Tu contraseña" required>
      </div>
      <button type="submit" class="btn btn-full">Ingresar</button>
    </form>

    <p class="auth-link">
      ¿No tienes cuenta? <a href="{{ url_for('registro') }}">Regístrate</a>
    </p>
  </div>
</div>
{% endblock %}
