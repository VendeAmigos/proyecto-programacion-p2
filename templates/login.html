{% extends "base.html" %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-box">
        <h2>Iniciar Sesión</h2>
        <p style="color: var(--text-secondary); margin-bottom: 2rem;">Accede a tu cuenta de Audio Minimal.</p>
        
        <form action="{{ url_for('login') }}" method="POST">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" name="username" placeholder="Tu usuario" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" name="password" placeholder="Tu contraseña" required>
            </div>
            
            <button type="submit" class="btn" style="width: 100%;">Ingresar</button>
        </form>
        
        <p style="margin-top: 2rem; font-size: 0.9rem;">
            ¿No tienes cuenta? <a href="{{ url_for('registro') }}" style="color: var(--text-primary); font-weight: 600;">Regístrate</a>
        </p>
    </div>
</div>
{% endblock %}
