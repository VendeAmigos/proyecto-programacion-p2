{% extends "base.html" %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-box">
        <h2>Crear Cuenta</h2>
        <p style="color: grey; margin-bottom: 2rem;">Únete y guarda tus pedidos.</p>

        <form action="{{ url_for('registro') }}" method="POST">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" name="username" placeholder="Elige un nombre de usuario" required>
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" name="password" placeholder="Mínimo 6 caracteres" required>
            </div>

            <button type="submit" class="btn" style="width: 100%;">Registrarme</button>
        </form>
        
        <p style="margin-top: 2rem; font-size: 0.9rem;">
            ¿Ya tienes cuenta? <a href="{{ url_for('login') }}" style="color: black; font-weight: bold;">Inicia Sesión</a>
        </p>
    </div>
</div>
{% endblock %}
