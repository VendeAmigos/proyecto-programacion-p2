{% extends "base.html" %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-box">
    <h2>Crear Cuenta</h2>
    <p class="auth-subtitle">Únete y guarda tus pedidos.</p>

    <form action="{{ url_for('registro') }}" method="POST">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" name="username" id="username" placeholder="Elige un nombre de usuario" required>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" name="password" id="password" placeholder="Mínimo 6 caracteres" required>
      </div>
      <button type="submit" class="btn btn-full">Registrarme</button>
    </form>

    <p class="auth-link">
      ¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia Sesión</a>
    </p>
  </div>
</div>
{% endblock %}
