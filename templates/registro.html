{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1 class="auth-title">Crear Cuenta</h1>
        
        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="nombre" class="label">Nombre Completo</label>
                <input 
                    type="text" 
                    id="nombre" 
                    name="nombre" 
                    class="input" 
                    placeholder="Tu nombre"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email" class="label">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    class="input" 
                    placeholder="tu@email.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password" class="label">Contraseña</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="input" 
                    placeholder="Mínimo 6 caracteres"
                    minlength="6"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password_confirm" class="label">Confirmar Contraseña</label>
                <input 
                    type="password" 
                    id="password_confirm" 
                    name="password_confirm" 
                    class="input" 
                    placeholder="Repite tu contraseña"
                    minlength="6"
                    required
                >
            </div>

            <button type="submit" class="btn btn--primary btn--full">
                Crear Cuenta
            </button>
        </form>

        <div class="auth-footer">
            <p>¿Ya tienes cuenta? 
                <a href="{{ url_for('login') }}" class="auth-link">Inicia sesión aquí</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
