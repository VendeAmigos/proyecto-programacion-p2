{% extends "base.html" %}

{% block content %}
<div class="error-container">

        <h1 class="error-code">500</h1>
        <h2 class="error-title">Error del Servidor</h2>
        <p class="error-message">Algo salió mal en nuestro servidor. Intenta más tarde.</p>
        
        <a href="{{ url_for('index') }}" class="btn btn--primary btn--large">
            Volver al Inicio
        </a>
    </div>
</div>
{% endblock %}
